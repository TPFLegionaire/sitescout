name: Bug report
description: Report reproducible SiteScout behaviour without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, customer audit data or screenshots containing personal information.
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Include the smallest synthetic reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Could this expose a security boundary?
      options: ["No", "Unsure - I will use a private security advisory"]
    validations:
      required: true
